repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: gitleaks
        name: gitleaks (API keys, tokens, passwords)
        entry: gitleaks git --pre-commit --staged --redact --verbose --no-banner
        language: system
        pass_filenames: false
