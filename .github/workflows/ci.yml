name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
  
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install uv (with dependency caching)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python + dependencies exactly as locked
        
        run: uv sync --frozen

      - name: Run tests
        
        run: uv run python -m pytest
        
      - name: Ruff linting
        run: uv run ruff check --output-format=github . 

      - name: Ruff format check
        run: uv run ruff format --check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repo with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every commit, so a key committed and later deleted is still caught

      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit for API keys, tokens and passwords
        run: ./gitleaks git --redact --verbose
