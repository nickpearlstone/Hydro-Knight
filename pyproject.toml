[project]
name = "hydro-knight"
version = "0.1.0"
description = "Pose-based anomaly detection for swimming-pool drowning safety."
readme = "README.md"
requires-python = ">=3.11"
# must stay AGPL-3.0
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp[curl-cffi]>=2026.8.19",  # keep curl-cffi
    "certifi>=2024.0.0",
    "opencv-python>=4.9.0",
    "flask>=3.0",
    "ultralytics>=8.4.0",
    "supervision>=0.29.0",
    "trackers>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
hydroknight = "hydro_knight.cli:main"

[project.optional-dependencies]
spike = ["mediapipe>=0.10.0"]
tracking = ["mlflow>=2.9.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_knight"]
